<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOUTRIST PLACES</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: grey;
            padding: 50px;
            display: flex;
        }
        .parent{
            background-color: white;
            width: 400px;
            /* height: 600px; */
            border-radius: 7px;
            margin: 10px;
        }
        .img {
            text-align: center;
            padding-top: 10px;
        }
        .img img{
            border-radius: 7px;
        }
        .capsule{
            margin: 10px;
        }
        .capsule span{
            border: 1px solid gray;
            padding: 0px 6px;
            border-radius: 7px;
            font-size: 15px;
            font-family: 'Baloo Bhai 2', sans-serif;
        }
        .heading{
            margin: 10px;
            padding: 0px 6px;
        }
        .content{
            margin: 10px;
            padding: 0px 6px;
            font-size: 15px;
            font-style: oblique;
        }
        .button{
            text-align: center;
            margin: 3px;
            padding: 7px;
        }
        .button button{
            background-color: rgb(147, 190, 234);
        }

    </style>
</head>
<body>
    <div class="parent">
        <div class="img">
            <img src="Screenshot 2026-08-15 at 5.19.11 PM.png" width="300px" height="250px" alt="photo">
        </div>
        <div class="capsule">
            <span>Natural</span>
            <span>Religional</span>
        </div>
        <div class="heading">
            <h1>TAKE YOUR TOUR </h1>
        </div>
        <div class="content">
            Travel is more than just visiting new places; it is about discovering new experiences, meeting new people, and creating beautiful memories. Every journey brings a new story, a new adventure, and a chance to see the world from a different perspective.

        </div>
        <div class="button">
            <button>READ MORE</button>
        </div>


    </div>
</body>
</html>
