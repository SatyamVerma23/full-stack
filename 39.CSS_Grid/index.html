<!-- when you write this(width: 80vw;) and after this 1fr 2fr 3 fr thats mean 80 ka 1 fraction , 80 ka 2 fraction... 

dont use margin or padding insted of this use gap 

place content : center --- this work as both justify and align to make center

-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <style>
        .container {
            width: 80vw;
            height: 100vh;
            border: 2px solid black;
            /* grid is used to create row and colum which is seen in inspection */
            display: grid;
            /* grid-template-columns: [pehla] 120px [doosra] 100px [t]; */
            /* grid-template-rows: 100px 100px 100px; */
                                    /* |       |       |
                                    row1    row2    row 3 */
            /* grid-template-columns: repeat(4, minmax(100px, 1fr)); */
            grid-template-columns: repeat(4, 80px); --> this makes  4 colum of 80px
            grid-template-rows: repeat(2, 80px);
            /* gap: 34px; */
            row-gap: 10px;
            column-gap: 44px;

            /* below is used to make box at center in width wise */
            justify-items: center;
            /* below is used to make box at center in height wise */
            align-items: center;
        }

        .item {
            border: 2px solid red;
            height: 55px;
            width: 55px;
        }

        /* below (item-4 & item-1) is used to overlap item-4 and item-1 box */
        .item-4 {
            /* grid-row: 1/2;  --->this line says that item4 start with 1 and end at 2
            grid-column: pehla/t; */
        }
        .item-1 {
            /* grid-row: 1/2; */

            /* or you can do  */
            /* grid-row-start: 1;
            grid-row-end: 2; */

            /* same thing */
            /* grid-column: 1/2; */
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="item item-1">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item item-4">4</div>
        <div class="item">5</div>
    </div>
</body>

</html>
