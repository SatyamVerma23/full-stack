<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- to set image (int theis you adjust height and width of img) -->
    <!-- alt="Train image" this denote image's name on website -->
    <img height="230" src="image.png" alt="Train image">
    
    <!-- br used to change line -->
    <br>
    <!-- to create table  -->
    <table>
        <!-- caption use to denote tables's caption  -->
        <caption>Employee Details</caption>
        <!-- thead classisfy content of table like this section is head ,other is body ,other is ebd -->
        <thead>
            <!-- tr denote table row (it wite in row wise) -->
            <tr>
                <!-- th denote head of table -->
                <th>Name</th>
                <th>Designation</th>
                <th>Fav Language</th>
            </tr>
        </thead>
        <!-- tbody denote section of body -->
        <tbody>
            <tr>
                <!-- td denote data of table -->
                <td>Harry</td>
                <td>Programmer</td>
                <td>JavaScript</td>
            </tr>

            <tr>
                <!-- colspan="2" use to merge row or colum -->
                <td colspan="2">Sam</td>
                <td rowspan="2">Java</td>
            </tr>
            <tr>
                <td colspan="2">Sam</td>
            </tr>
        </tbody>
        <!-- tfoot  denote section of end -->
        <tfoot>
            <tr>
                <td colspan="2">Sam</td>
                <td rowspan="2">foot</td>
            </tr>
        </tfoot>
    </table>

    <!-- this ul is denote unorder list -->
    <ul type="square">
        <li>Harry</li>
        <li>Rohan</li>
        <li>Shubham</li>
    </ul>
    <!-- ol denote order list -->
    <ol type="A">
        <li>Harry</li>
        <li>Rohan</li>
        <li>Shubham</li>
    </ol>

</body>

</html>
