    <style>
        /* .box:first-child{

        /* this below line is used to make first line change color even when you reduse size of website(at this time still first line change color) */
        /* .box::first-line{

        /*     (*) ---> this denote for all         */
        /* .boxes *{
            color: blue;

        /* .box:nth-child(odd){
            background-color: blue;
        } */

        /* .box:nth-last-child(2){
            background-color: red;
        } */

        /* below line is used to wite something before boxes div tag */
        .boxes::before {
            content: "Harry is good";
            color: blue;
        }

        /* below line is used to wite something after boxes div tag */
        .boxes::after {
            content: "Sigma course is also good";
            color: red;
        }

        /* ::selection is a CSS pseudo-element used to style the text when the user selects/highlights it with the mouse. */
        ::selection {
            background-color: black;
            color: aqua;
        }

        /* this make font size increase of first letter of box div tag */
        .box::first-letter {
            color: peru;
            font-size: 45px;
        }

        /* input::placeholder is used to style the placeholder text inside an <input> field.
        (ek input box mein style krega) */
        input::placeholder {
            color: rgb(84, 84, 88);
        }
    </style>
</head>

<body>
    <div class="boxes">
        <div data-color="primary" class="box">I am first box</div>
        <div class="box">Hey I am a box</div>
        <div class="box">Hey I am a box</div>
        <input type="text" placeholder="Type your name here">
    </div>
</body>
