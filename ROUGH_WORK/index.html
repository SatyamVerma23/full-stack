<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POSTION PROPERTY</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            position: relative;
        }
        .parent{
            border: 20px solid black;
        }
        .box {
            height: 433px;
            width: 80vw;
            padding: 3px;
            margin: 3px;
            border: 2px solid black;
        }
        .box1{
            background-color: aqua;
            position: absolute;
            top: 100px;
            left:20px;

        }
        .box2{
            background-color: rgb(137, 11, 49);
        }
        .box3{
            background-color: rgb(221, 79, 14);
        }
        .box4{
            background-color: rgb(150, 162, 130);
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>
</html>
