<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS object Fit and position</title>
    <style>
        .container {
            height: 488px;
            width: 466px;
            border: 2px solid black;
            /* background-color: azure; */

            /* to set image postion on website background */
            background-position: center center;
            background-clip: border-box;

            /* to set img in background */
            background-image: url("https://us.123rf.com/450wm/progressman/progressman1909/progressman190900115/130695651-woman-in-black-coat-walking-along-the-sea.jpg?ver=6");
            
            /* if img is sort then it start repeat to prevent this we use this; */
            background-repeat: no-repeat;
        }

        img {
            width: 466px;
            height: 488px;

            /* below line is use to make fill immage in above width: and height: without distroted , in this img will croped */
            object-fit: contain;

            /* img geeting filled in h & w but getting distorted */
            /* object-fit: fill; */

            /* in this it is used to give gap like margin btw border or img */
            object-position: 10px 20px;

            /* this below line denote to decide which part will croped */
            /* object-position: bottom right; */
            /* object-fit: contain; */
        }
    </style>
</head>

<body>
    <div class="container">
        
        <!-- <img src="https://images.unsplash.com/photo-1575936123452-b67c3203c357?q=80&w=1000&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8aW1hZ2V8ZW58MHx8MHx8fDA%3D" alt=""> -->
    </div>
</body>

</html>
