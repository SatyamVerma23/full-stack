<!-- 00:39 Static Position
=>Static = normal/default position.
The element stays where it naturally comes in the HTML.

04:30 Relative Position
=>Relative = move the element from its normal position.

08:21 Absolute Position
=>Absolute = remove the element from the normal page flow and position it relative to its nearest positioned parent.

12:50 Fixed Position
=>Fixed = stays in the same place on the screen even when you scroll.

15:06 Sticky Position
=>Sticky = behaves normally at first, but sticks to a position when you scroll.

transform
transform is used to visually move, rotate, resize, or tilt an element.
ex .box {
    transform: translateX(50px);
}

filter
filter is used to apply visual effects to an element.
ex img {
    filter: blur(5px);
}

perspective
perspective is used to create a 3D depth effect.
ex .box {
    perspective: 500px;
}
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            height: 433px;
            width: 80vw;
            padding: 3px;
            margin: 3px;
            border: 2px solid black;
        }

        .box1 {
            background-color: aqua;
            /* position: sticky;
            top:0px;
            height: 111px;
            width:100%;
            margin: 0;
            padding: 0; */
            position: absolute;
            top: 0px;
            left:3px;
        }

        .box2 {
            background-color: azure;
            /* position: relative;
            top: 34px;
            left: 56px; */
        }

        .box3 {
            background-color: antiquewhite;
            /* position: fixed;
            bottom: 0px;
            left:8vw;
            height: 111px; */
        }

        .box4 {
            background-color: purple;
        }

      

        .parent {
            padding: 43px;
            margin: 34px;
            border: 3px solid purple;
            /* position: relative; */


            /* Exception: transform, filter, or perspective properties can also make an element appear as positioned */
            /* transform: translate(0); */
            /* filter: invert(0); */
            /* perspective: 0em; */
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>

</html>
