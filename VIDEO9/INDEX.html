04:43 Id 
id is an HTML attribute used to uniquely identify one element on a webpage.

Classes
class is an HTML attribute used to give one or more elements the same name/group so you can style or control them together.

 🗿 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID and Classes in HTML</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- id is unique for evemt content or element  -->
    <!-- class can be multiple  -->
    <div id="firstdiv" class="red bg-yellow">First</div>
    <div id="seconddiv">Second</div>
    <span class="red"></span>
</body>
</html>
