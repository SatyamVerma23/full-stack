<!-- CSS Media Queries are used to make a website responsive, meaning its design changes according to the screen size or device. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS media query</title>
    <style>
        body {
            background-color: rgb(249, 16, 144);
        }
        /* to adjust screen when we reduse website size it change color from pink to blue. */
        @media screen and (orientation: portrait) {
            body{
                border: 2px solid purple;
            }
        }
        /* to adjust screen when we reduse website size it change color and div arrangement */
        @media only screen and (max-width: 455px){
            body{

                background-color: blue;
            }
            
            .boxes{
                flex-direction: column;
            }
        }

        .boxes{
            display: flex;
        }

        .box{
            width: 344px;
            height: 344px;
            background-color: steelblue;
            padding: 3px;
            margin: 3px;
        }

    </style>
</head>

<body>
    <div>
        Hey I am a red body guy!
    </div>

    <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>

</html>
