<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netfilx</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <nav class="logo">
            <div>
                <img src="netflix logo.svg" height="35px" alt="logo">
            </div>
            <div class="press">
                <button class="language">English</button>
                <button class="click">Sign In</button>
            </div>
        </nav>
        <div class="beech">
            <div class="fline">
                Enjoy big movies, hit series and more from 7 149.
            </div>
            <div class="sline">
                Join today. Cancel anytime.
            </div>
            <div class="tline">
                Ready to watch? Enter your email to create or restart your membership.
            </div>
            <div class="belowbeech">
                <span class="email">
                    <input type="text" placeholder="Email Address">
                </span>
                <span class="getbutton">
                    <button>Get Started</button>
                </span>
            </div>
        </div>
        <div class="line">

        </div>
    </div>
</body>
</html>
